# ---------------------------------------------------------------------------
# SonarQube / SonarCloud analysis configuration
#
# Host URL and token are provided by the ENVIRONMENT, never committed here:
#   • Locally : export SONAR_HOST_URL / SONAR_TOKEN  (kept in your gitignored .env)
#   • Jenkins : injected automatically by withSonarQubeEnv('SonarQube')
# The sonar-scanner CLI reads SONAR_HOST_URL and SONAR_TOKEN natively.
# ---------------------------------------------------------------------------

sonar.projectKey=swag-labs-playwright
sonar.projectName=Swag Labs Playwright BDD Framework
sonar.projectVersion=1.0.0

# Source & test layout
sonar.sources=src
sonar.tests=features
sonar.sourceEncoding=UTF-8

# Exclude generated, third-party and report artefacts from analysis.
# (tests/ is generated by bddgen and gitignored, so it isn't analysed.)
sonar.exclusions=node_modules/**,tests/**,allure-results/**,allure-report/**,reports/**,test-results/**,coverage/**

# Config/data files — analyse them but don't demand test coverage
sonar.coverage.exclusions=**/*.feature,playwright.config.js,src/data/**

# JavaScript/TypeScript coverage (optional). Enable once you wire up coverage
# output (e.g. via nyc/c8) that emits an LCOV file at the path below.
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
