# ---------------------------------------------------------------------------
# SonarQube / SonarCloud analysis configuration
# Run locally with:  sonar-scanner   (requires SONAR_HOST_URL + SONAR_TOKEN)
# In CI this is invoked from the Jenkinsfile "SonarQube Analysis" stage.
# ---------------------------------------------------------------------------

sonar.projectKey=swag-labs-playwright
sonar.projectName=Swag Labs Playwright BDD Framework
sonar.projectVersion=1.0.0
sonar.host.url=http://localhost:9090

# Source & test layout
sonar.sources=src
sonar.tests=features
sonar.sourceEncoding=UTF-8

# Exclude generated, third-party and report artefacts from analysis
sonar.test.inclusions=tests/**/*.spec.ts
sonar.exclusions=node_modules/**,allure-results/**,allure-report/**,reports/**,test-results/**,coverage/**

# These are config/data files — analyse them but don't demand test coverage
sonar.coverage.exclusions=**/*.feature,playwright.config.js,src/data/**

# JavaScript/TypeScript coverage (optional). Enable once you wire up coverage
# output (e.g. via nyc/c8) that emits an LCOV file at the path below.
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
